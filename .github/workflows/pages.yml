name: Build and deploy Pages

# Pages is set to "GitHub Actions" as its source, so this workflow is the only
# thing that publishes https://code.178.is/Recipes/.
#
# Deliberately no `paths:` filter — every file in the repo is an input to the
# Jekyll build (README.md becomes the /Recipes/ landing page), so filtering
# could only ever produce a stale deploy.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: permissions are granted per job, not workflow-wide. The build
# job reads the repo and nothing else; only deploy can publish.
permissions: {}

# Never cancel a half-finished deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No dependencies to install: the tools are TypeScript run directly by
      # Node's native type stripping, tested with Node's built-in test runner.
      - name: Run tests
        run: npm test

      - uses: actions/configure-pages@v6

      # The same builder the legacy branch build used, so /Recipes/ (the README
      # rendered by Jekyll's default theme) keeps working exactly as before.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # jekyll-build-pages runs in a container as root, so _site comes back
      # owned by root and the runner user cannot write into it.
      - name: Take ownership of the build output
        run: sudo chown -R "$(id -u):$(id -g)" _site

      # Replaces Paprika's flat alphabetical list with a generated index that
      # has lists by category. Runs before injection: the generated page carries
      # its own viewport meta, so the injector skips it.
      - name: Build the recipe index
        run: node tools/build-index.ts _site

      - name: Inject viewport meta
        run: node tools/inject-viewport.ts _site

      - name: Verify built site
        run: node tools/verify-site.ts . _site

      # paprika-export/ is read-only input: it is regenerated wholesale from the
      # Paprika app, so anything written there would be silently lost.
      - name: Assert the export was not modified
        run: |
          if [ -n "$(git status --porcelain -- paprika-export)" ]; then
            echo "::error::the build modified paprika-export/, which must be read-only input"
            git status --porcelain -- paprika-export
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Pull requests build and upload an artifact for inspection, but never deploy.
  # The ref guard matters for workflow_dispatch: without it, dispatching from any
  # branch would publish that branch's build to the live site.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
