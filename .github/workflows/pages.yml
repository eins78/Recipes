name: Build and deploy Pages

# Pages is set to "GitHub Actions" as its source, so this workflow is the only
# thing that publishes https://code.178.is/Recipes/.
#
# Deliberately no `paths:` filter — every file in the repo is an input to the
# Jekyll build (README.md becomes the /Recipes/ landing page), so filtering
# could only ever produce a stale deploy.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: permissions are granted per job, not workflow-wide. The build
# job reads the repo and nothing else; only deploy can publish.
permissions: {}

# Never cancel a half-finished deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No dependencies to install: the tools are TypeScript run directly by
      # Node's native type stripping, tested with Node's built-in test runner.
      - name: Run tests
        run: npm test

      - uses: actions/configure-pages@v5

      # The same builder the legacy branch build used, so /Recipes/ (the README
      # rendered by Jekyll's default theme) keeps working exactly as before.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Inject viewport meta
        run: node tools/inject-viewport.ts _site

      - name: Verify built site
        run: node tools/verify-site.ts . _site

      # paprika-export/ is read-only input: it is regenerated wholesale from the
      # Paprika app, so anything written there would be silently lost.
      - name: Assert the export was not modified
        run: |
          if [ -n "$(git status --porcelain -- paprika-export)" ]; then
            echo "::error::the build modified paprika-export/, which must be read-only input"
            git status --porcelain -- paprika-export
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Pull requests build and upload an artifact for inspection, but never deploy.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
